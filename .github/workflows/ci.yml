name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Detect whether any non-markdown files changed. The build/test jobs key
  # off this so docs-only PRs skip the expensive work, while the final
  # `ci` job always runs and can be used as the required status check.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - '!**/*.md'

  server:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # x64 free runners have 16 GB RAM; the arm64 partner runners only have
    # 8 GB, and qbe compiling the server module overruns that even with
    # -j1.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      # We run the build inside a container based on alpine:edge rather
      # than using `container: alpine:edge` at the job level so
      # actions/checkout executes on the host and doesn't have to deal
      # with musl/node quirks.
      #
      # The image (alpine:edge + apk packages) is built once and cached
      # via the GitHub Actions cache backend, so subsequent runs skip
      # the apk install layer entirely when alpine:edge's digest and
      # the package list are unchanged.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build cached test image
        uses: docker/build-push-action@v7
        with:
          context: .github/docker
          tags: hare-lsp-ci:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and test in Alpine
        # Trying without HAREFLAGS=-j1 to see whether the qbe-per-CPU
        # memory pressure that motivated it still trips on the 16 GB
        # x64 runners. Revert this commit if the runner OOMs.
        run: |
          docker run --rm -v "$PWD":/workspace -w /workspace hare-lsp-ci:latest sh -c '
            set -eux
            free -m
            make
            make test
          '

  vscode-extension:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - name: Install dependencies
        working-directory: editors/vscode
        run: npm ci

      # Runs the vitest suite (currently the terminal-output parser
      # that drives the test-status gutter). Kept separate from the
      # `server` job because users running hare-lsp from non-VSCode
      # editors shouldn't need Node to run `make test`.
      - name: Run vitest suite
        run: make vscode-test

      # `npm run package` runs `tsc --noEmit` (typecheck), then vitest,
      # then esbuild (bundle), then `vsce package`, so it covers compile
      # errors, tests, bundling, and packaging regressions in one shot.
      - name: Typecheck and package
        working-directory: editors/vscode
        run: npm run package

  # @vscode/test-electron suite. Spawns a real VSCode build, loads the
  # in-tree extension as a development extension, and drives the
  # LanguageClient via vscode.execute*Provider commands. The binary
  # under test is built inside the existing Alpine image (so the same
  # hare toolchain as the server job); VSCode itself runs on the
  # ubuntu-24.04 host because the official Linux build is glibc-based
  # and does not run in Alpine.
  vscode-e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build cached test image
        uses: docker/build-push-action@v7
        with:
          context: .github/docker
          tags: hare-lsp-ci:latest
          load: true
          cache-from: type=gha

      # Build hare-lsp inside Alpine (so hare-the-compiler is
      # available), but only the binary - we run the tests on the
      # ubuntu-24.04 host below.
      - name: Build hare-lsp in Alpine
        run: |
          docker run --rm -v "$PWD":/workspace -w /workspace hare-lsp-ci:latest sh -c '
            set -eux
            make hare-lsp
          '

      - name: Install vscode extension dependencies
        working-directory: editors/vscode
        run: npm ci

      # @vscode/test-electron caches its VSCode download under
      # editors/vscode/.vscode-test/. Cache across runs to avoid the
      # ~100MB re-download.
      - name: Cache VSCode download
        uses: actions/cache@v4
        with:
          path: editors/vscode/.vscode-test
          key: vscode-test-${{ runner.os }}

      # VSCode (Electron) needs an X server on Linux. xvfb-run starts
      # one for the duration of the command.
      - name: Run @vscode/test-electron suite
        working-directory: editors/vscode
        env:
          HARE_LSP_BIN: ${{ github.workspace }}/hare-lsp
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          xvfb-run -a npm run test:e2e

  # Plenary-driven Neovim e2e suite. Drives the in-tree editors/nvim
  # plugin against ./hare-lsp from a real Neovim session, asserting on
  # LSP responses through the editor's own client. Mirrors the
  # `server` job's container strategy (the same Alpine image already
  # has neovim installed) so that the binary under test is bit-for-bit
  # the one CI ships, and so the GHA cache is shared.
  nvim-test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build cached test image
        uses: docker/build-push-action@v7
        with:
          context: .github/docker
          tags: hare-lsp-ci:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # plenary.nvim is gitignored under e2e-nvim/.deps/. Cache its
      # clone across runs, keyed on the Makefile's contents - bumping
      # PLENARY_TAG (or any other Makefile change) invalidates the
      # cache, and the Makefile rule re-clones. Without the
      # hashFiles binding, bumping PLENARY_TAG would silently restore
      # the previous tag from cache (the Makefile rule skips its
      # `git clone` when the .deps dir already exists).
      - name: Cache plenary.nvim
        uses: actions/cache@v4
        with:
          path: e2e-nvim/.deps/plenary.nvim
          key: plenary-${{ hashFiles('Makefile') }}

      - name: Build and run plenary suite in Alpine
        run: |
          docker run --rm -v "$PWD":/workspace -w /workspace hare-lsp-ci:latest sh -c '
            set -eux
            make nvim-test
          '

  # Single aggregator job that always runs. Use this as the required
  # status check in branch protection: it passes when the real jobs
  # succeed or were skipped (docs-only change), and fails if any of
  # them failed or was cancelled.
  ci:
    if: always()
    needs: [changes, server, vscode-extension, vscode-e2e, nvim-test]
    runs-on: ubuntu-24.04
    steps:
      - name: Check job results
        run: |
          set -eu
          changes='${{ needs.changes.result }}'
          server='${{ needs.server.result }}'
          vscode='${{ needs.vscode-extension.result }}'
          vscode_e2e='${{ needs.vscode-e2e.result }}'
          nvim='${{ needs.nvim-test.result }}'
          echo "changes=$changes server=$server vscode-extension=$vscode vscode-e2e=$vscode_e2e nvim-test=$nvim"
          if [ "$changes" != "success" ]; then
            echo "changes job did not succeed"
            exit 1
          fi
          for r in "$server" "$vscode" "$vscode_e2e" "$nvim"; do
            case "$r" in
              success|skipped) ;;
              *) echo "dependent job result: $r"; exit 1 ;;
            esac
          done
